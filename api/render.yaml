# Render Blueprint — deploy the Sekar Construction API (not the static site).
#
# Easiest path (no Blueprint path confusion):
#   Render → New → Web Service → connect repo → Root Directory: api
#   Runtime: Docker → uses api/Dockerfile
#   Attach external MariaDB/MySQL → set DATABASE_URL (mysql://…)
#   Copy env vars from below
#
# Blueprint: place/apply with service rootDir "api" so Docker paths resolve inside api/.
#
# After deploy:
# 1. Copy the service URL (https://….onrender.com)
# 2. Set REMOTE_API_BASE in config.site.js to that URL (no trailing slash)
# 3. Ensure CORS_ORIGINS includes https://nplmedmarketing-collab.github.io
# 4. Run migrate (Dockerfile does this on boot). Import content separately — do not seed over real CMS data.
#
# Free tier spins down when idle — first request after sleep can take ~30–60s.
#
# NOTE: This API requires MariaDB/MySQL. Render’s free Postgres addon is not compatible.

services:
  - type: web
    name: sekar-api
    rootDir: api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Set DATABASE_URL in the Render Dashboard to your MariaDB/MySQL URL (mysql://…)
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Cross-origin admin from GitHub Pages (Bearer auth + credentials). Add custom domains as needed.
      - key: CORS_ORIGINS
        value: https://nplmedmarketing-collab.github.io
      # Cookie fallback for cross-site; admin primarily uses Authorization: Bearer from sessionStorage.
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      # Prefer content import over seed. If you must seed once on empty DB:
      # SEED_ADMIN_USERNAME=superadmin
      # SEED_ADMIN_PASSWORD=<strong unique password>
