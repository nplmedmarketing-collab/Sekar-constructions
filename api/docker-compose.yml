# Local-dev MariaDB only — NOT for production.
# Credentials below are intentionally simple for local machines.
# Path: api/docker-compose.yml (run from api/: npm run db:up)
#
# Requires: Docker Desktop (or Docker Engine + Compose plugin)
# Docs: api/README.md

services:
  mariadb:
    image: mariadb:11
    container_name: sekar-cms-mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      # LOCAL-DEV ONLY — do not reuse in production
      MARIADB_DATABASE: Sekarcons
      MARIADB_USER: gan131
      MARIADB_PASSWORD: change-me-local-only
      MARIADB_ROOT_PASSWORD: change-me-root-local-only
    volumes:
      - sekar_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sekar_mariadb_data:
    name: sekar_cms_mariadb
